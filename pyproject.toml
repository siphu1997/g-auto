[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tlbb-auto"
version = "0.1.0"
description = "Windows-first TLBB automation framework for LDPlayer 9"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "numpy>=2.1.0,<3.0.0",
  "opencv-python-headless>=4.10.0.84,<5.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pytesseract>=0.3.13,<0.4.0",
  "pyyaml>=6.0.2,<7.0.0",
  "uvicorn>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/core",
  "src/dashboard",
  "src/games",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

